version: 1
name: 111_full_predicted_read_prefetch
hypothesis: Start one predicted uncached expert read before attention, consume only if selected by actual routing,
  drain unused reads. Preserve exact outputs/routes/cache admission and verify all actual predicted read/byte
  counters. Compare against110 fresh control.
measurement_scope: full_large_model_decode
validation_metric: correctness_verified
question: q108
moonshot: true
runner:
  backend: ssh
  host: inkling-ptl-direct
  user: devcloud
  timeout_seconds: 7200
  ssh_options:
  - -o
  - ServerAliveInterval=15
  - -o
  - ServerAliveCountMax=3
  command: powershell -NoProfile -File C:/Users/devcloud/inkling-autolab/run-full.ps1 -Model "{model}" -Cases
    "{cases}" -Binary full-predicted-read.exe -PredictReads 1 -Threads {threads} -AffinityMask {affinity} -CacheDecayRequests
    {decay} -CacheRecentTies 1 -Reads 0 -Bf16Rows {bf16_rows} -Int4Rows {int4_rows} -MmapEmbed 1 -ReuseBuffers
    1 -OwnShared 1 -UncachedReads 1 -PipelineReads 1 -ExpertCacheMiB 256 -PrefillReads 1 -CacheResetHistory
    1 -SkipBulkPrefetch 1 -Tokens 64 -Samples 1 -Out C:/Users/devcloud/inkling-autolab/111-predicted-read-prefetch.json
    -RouteTrace C:/Users/devcloud/inkling-autolab/111-predicted-read-prefetch-routes.json -LayerProfile C:/Users/devcloud/inkling-autolab/111-predicted-read-prefetch-layers.json
    -Log C:/Users/devcloud/inkling-autolab/111-predicted-read-prefetch.log
  connect_timeout: 30
defaults:
  model: C:/Users/devcloud/inkling-autolab/model
  cases: C:/Users/devcloud/inkling-autolab/large-cases.baseline-reference.json
  expected_hash: ce0fbb9a116d3d09
grid:
  decay:
  - 32
  bf16_rows:
  - 2
  int4_rows:
  - 4
  threads:
  - 16
  affinity:
  - 65535
metrics:
  primary: decode_tokens_per_s
  direction: maximize
  collect:
  - name: decode_tokens_per_s
    pattern: (?m)^decode_tokens_per_s=([\d.eE+-]+)
  - name: output_hash
    pattern: (?m)^output_hash=([0-9a-f]+)
    type: str
  - name: full_model
    pattern: (?m)^full_model=(\d+)
    type: int
  - name: correctness_verified
