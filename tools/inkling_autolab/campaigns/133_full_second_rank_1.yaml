version: 1
name: 133_full_second_rank_1
hypothesis: Vary only the original predicted-rank ceiling for the second of at most two concurrent reads.
  Compare rank1,3,5 against default2 with exact outputs/routes/cache and causal read forecasts. Preserve
  all samples; any promotion requires repeated confirmation.
measurement_scope: full_large_model_decode
validation_metric: correctness_verified
question: q130
moonshot: true
runner:
  backend: ssh
  host: inkling-ptl-direct
  user: devcloud
  timeout_seconds: 7200
  ssh_options:
  - -o
  - ServerAliveInterval=15
  - -o
  - ServerAliveCountMax=3
  command: powershell -NoProfile -File C:/Users/devcloud/inkling-autolab/run-full.ps1 -Model "{model}"
    -Cases "{cases}" -Binary full-second-rank.exe -PredictReads 1 -Threads {threads} -AffinityMask {affinity}
    -CacheDecayRequests {decay} -CacheRecentTies 1 -Reads 0 -Bf16Rows {bf16_rows} -Int4Rows {int4_rows}
    -MmapEmbed 1 -ReuseBuffers 1 -OwnShared 1 -UncachedReads 1 -PipelineReads 1 -ExpertCacheMiB 256 -PrefillReads
    1 -CacheResetHistory 1 -SkipBulkPrefetch 1 -Tokens 64 -Samples 1 -Out C:/Users/devcloud/inkling-autolab/133-second-rank-1.json
    -RouteTrace C:/Users/devcloud/inkling-autolab/133-second-rank-1-routes.json -LayerProfile C:/Users/devcloud/inkling-autolab/133-second-rank-1-layers.json
    -Log C:/Users/devcloud/inkling-autolab/133-second-rank-1.log -EarlyPredictReads 0 -SecondPredictReads
    1 -SecondPredictRank 1
  connect_timeout: 30
defaults:
  model: C:/Users/devcloud/inkling-autolab/model
  cases: C:/Users/devcloud/inkling-autolab/large-cases.baseline-reference.json
  expected_hash: ce0fbb9a116d3d09
grid:
  decay:
  - 32
  bf16_rows:
  - 2
  int4_rows:
  - 4
  threads:
  - 16
  affinity:
  - 65535
