version: 1
name: 072_full_cache_decay_32
hypothesis: Shorter causal frequency history may adapt the routed cache within a response and reduce remaining
  expert reads while retaining identical weights and outputs.
measurement_scope: full_large_model_decode
validation_metric: correctness_verified
question: q62
moonshot: true
runner:
  backend: ssh
  host: inkling-ptl-direct
  user: devcloud
  timeout_seconds: 7200
  ssh_options:
  - -o
  - ServerAliveInterval=15
  - -o
  - ServerAliveCountMax=3
  command: powershell -NoProfile -File C:/Users/devcloud/inkling-autolab/run-full.ps1 -Model "{model}"
    -Cases "{cases}" -Binary full-cache-decay.exe -Threads 16 -CacheDecayRequests {decay} -Reads 0 -Bf16Rows
    2 -Int4Rows 4 -MmapEmbed 1 -ReuseBuffers 1 -OwnShared 1 -UncachedReads 1 -PipelineReads 1 -ExpertCacheMiB
    256 -PrefillReads 1 -CacheResetHistory 1 -SkipBulkPrefetch 1 -Tokens 64 -Samples 1 -Out C:/Users/devcloud/inkling-autolab/072-decay-32.json
    -RouteTrace C:/Users/devcloud/inkling-autolab/072-decay-32-routes.json -LayerProfile C:/Users/devcloud/inkling-autolab/072-decay-32-layers.json
    -Log C:/Users/devcloud/inkling-autolab/072-decay-32.log
defaults:
  model: C:/Users/devcloud/inkling-autolab/model
  cases: C:/Users/devcloud/inkling-autolab/large-cases.baseline-reference.json
  expected_hash: ce0fbb9a116d3d09
grid:
  decay:
  - 32
metrics:
  primary: decode_tokens_per_s
  direction: maximize
  collect:
  - name: decode_tokens_per_s
    pattern: (?m)^decode_tokens_per_s=([\d.eE+-]+)
  - name: output_hash
    pattern: (?m)^output_hash=([0-9a-f]+)
    type: str
  - name: full_model
    pattern: (?m)^full_model=(\d+)
    type: int
  - name: correctness_verified
    pattern: (?m)^correctness_verified=(\d+)
    type: int
  - name: decode_steps_min
    pattern: (?m)^decode_steps_min=(\d+)
    type: int
  - name: repetitions
    pattern: (?m)^repetitions=(\d+)
    type: int
  - name: embedding_mapped
    pattern: (?m)^embedding_mapped=(\d+)
    type: int
  - name: reuse_buffers
    pattern: (?m)^bf16_rows=.* reuse_buffers=(\d+)
    type: int
  - name: owned_shared_bytes
    pattern: (?m)^owned_shared_bytes=(\d+)
    type: int
  - name: uncached_read_bytes
    pattern: (?m)^uncached_read_bytes=(\d+)
    type: int
  - name: uncached_read_fallbacks
    pattern: (?m)^uncached_read_fallbacks=(\d+)
    type: int
  - name: uncached_read_effective
    pattern: (?m)^uncached_read_effective=(\d+)
    type: int
  - name: pipelined_read_layers
    pattern: (?m)^pipelined_read_layers=(\d+)
    type: int
  - name: pipeline_reads_effective
    pattern: (?m)^pipeline_reads_effective=(\d+)
    type: int
  - name: expert_cache_capacity_bytes
    pattern: (?m)^expert_cache_capacity_bytes=(\d+)
    type: int
  - name: expert_cache_retained_bytes
    pattern: (?m)^expert_cache_retained_bytes=(\d+)
    type: int
  - name: expert_cache_hits
    pattern: (?m)^expert_cache_hits=(\d+)
    type: int
  - name: expert_cache_hit_bytes
    pattern: (?m)^expert_cache_hit_bytes=(\d+)
    type: int
  - name: expert_cache_misses
    pattern: (?m)^expert_cache_misses=(\d+)
    type: int
  - name: expert_cache_admissions
    pattern: (?m)^expert_cache_admissions=(\d+)
    type: int
  - name: expert_cache_evictions
    pattern: (?m)^expert_cache_evictions=(\d+)
    type: int
  - name: expert_cache_effective
    pattern: (?m)^expert_cache_effective=(\d+)
    type: int
  - name: expert_cache_history_resets
    pattern: (?m)^expert_cache_history_resets=(\d+)
    type: int
  - name: prefill_read_experts
    pattern: (?m)^prefill_read_experts=(\d+)
    type: int
  - name: prefill_uncached_read_bytes
    pattern: (?m)^prefill_uncached_read_bytes=(\d+)
    type: int
  - name: prefill_uncached_read_fallbacks
    pattern: (?m)^prefill_uncached_read_fallbacks=(\d+)
    type: int
  - name: prefill_reads_effective
    pattern: (?m)^prefill_reads_effective=(\d+)
    type: int
  - name: rayon_threads
    pattern: (?m)^rayon_threads=(\d+)
    type: int
  - name: expert_cache_frequency_decays
    pattern: (?m)^expert_cache_frequency_decays=(\d+)
    type: int
stopping:
