- id: q7
  question: Why does adaptive residency repeatedly copy warm files on Windows?
  status: answered
  priority: 7
  answer: Working-set sample stays 0/64 after buffered reads/prefetch, becomes 64/64 after mapped
    page walk. Direct-read resident profile avoids repeated copies; cold paging policy remains
    unvalidated.
- id: q8
  question: Can optional NVIDIA CUDA quantization accelerate portable Inkling exports?
  status: answered
  priority: 8
  answer: RTX 4060 Ti 8 GB passes all 43 exporter tests and reproduces an original expert bin
    byte for byte. Real expert quantization including copies improves 4.23x; eight-expert warm-source
    conversion including fsynced writes improves 2.37x with CPU eight workers versus CUDA four
    workers. Full 975B export time remains unmeasured. Keep CPU default; use CUDA 64 MiB chunks
    when requested.
- id: q9
  question: How much time and cost does the designated 8xA100 export host save?
  status: answered
  priority: 9
  answer: "Designated8xA100 host is qualified for CUDA exports. Final default is8 processes\
    \ x1 worker,58.98 experts/s in the measured component; seeq12. Estimated whole export15\u2013\
    30minutes with local raw source ($4\u20138), initial download+export2\u20133hours ($30\u2013\
    45); no full export timed. Host backed up/idle, no termination performed."
- id: q10
  question: Can independent SSH jump transports fill PTL Ethernet better than one?
  status: answered
  priority: 5
  answer: Eight independent SSH jump transports with 32 HTTP workers sustain 103.70 MB/s, versus
    46.38 with four and 20.51 with one/eight workers. Retain eight transports, near the PTL
    1 Gb/s Ethernet limit; every file remains SHA-256 verified. This is deployment throughput,
    not model tokens/s.
- id: q11
  question: How much routed-expert reuse is available within PTL's memory budget?
  status: answered
  priority: 6
  answer: "Actual034 routes and causal cache models saved in037. Best8GiB policies simulate7.96\u2013\
    8.77GB routed reads/token; no actual cache speedup measured. Whole-span32GiB ideal reuse\
    \ still needs46\u201356GB/s at25tok/s, beyond15.754GB/s NVMe link."
- id: q12
  question: Can separate converter processes improve throughput beyond the A100 GPU thread pool?
  status: answered
  priority: 8
  answer: Eight independent CUDA processes achieve 58.98 experts/s on the saved 64-expert CPU
    oracle, 2.60x the prior GPU pool. Complete multiprocess export, staged resume, truncated-output
    repair and worker-failure gates pass; all 48 exporter tests pass. Default remote profile
    now uses eight processes and one worker each. Full export and cold-source I/O remain unmeasured.
- id: q13
  question: Does the full-model PTL baseline spend most time on compute or paging?
  status: answered
  priority: 6
  answer: Baseline sampled lifetime is78.7% kernel CPU with494348 faults/s and2.218GB/s machine
    reads.036 reduces faults to107292/s and private peak24.536GB to22.078GB; includes load/prefill
    and soft faults. Transient RAM pressure persists.
- id: q14
  question: Does batching Windows prefetch ranges improve expert page-in latency?
  status: answered
  priority: 7
  answer: Refuted. Serial prefetch+copy is 66.51 ms for eight real experts, versus 86.75 ms
    batched and 96.95 ms parallel. No-prefetch 65.02 ms differs only 2.3%; keep production unchanged
    pending actual full-model evidence. About 254 MB physical reads per 255 MB cohort; concurrent
    transfer noted.
